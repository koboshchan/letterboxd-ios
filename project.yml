name: Letterboxd
options:
  bundleIdPrefix: com.koboshchan
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: 9L8K7C9GMH
packages:
  LetterboxdKit:
    path: .
targets:
  Letterboxd:
    type: application
    platform: iOS
    sources:
      - path: Sources/Letterboxd
      - path: Resources/Letterboxd.icon
    dependencies:
      - package: LetterboxdKit
    info:
      path: Sources/Letterboxd/Info.plist
      properties:
        CFBundleDisplayName: Letterboxd
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.koboshchan.letterboxdreader
        ASSETCATALOG_COMPILER_APPICON_NAME: Letterboxd
        GENERATE_INFOPLIST_FILE: NO
  LetterboxdTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests/LetterboxdTests]
    dependencies:
      - target: Letterboxd
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  LetterboxdUITestHost:
    type: application
    platform: iOS
    sources:
      - path: Sources/Letterboxd
        excludes: [AppMain.swift, Info.plist]
      - path: Tests/UITestHost
    dependencies:
      - package: LetterboxdKit
    info:
      path: Tests/UITestHost/Info.plist
      properties:
        CFBundleDisplayName: Letterboxd UITest Host
        UILaunchScreen: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.koboshchan.letterboxdreader.uitesthost
        GENERATE_INFOPLIST_FILE: NO
  LetterboxdUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [Tests/LetterboxdUITests]
    dependencies:
      - target: LetterboxdUITestHost
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  LetterboxdUITests:
    build:
      targets:
        LetterboxdUITestHost: all
        LetterboxdUITests: [test]
    test:
      targets: [LetterboxdUITests]
